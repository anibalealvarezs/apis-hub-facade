services:
    facade-app:
        build:
            context: .
            dockerfile: Dockerfile
        image: apis-hub-facade-app
        restart: always
        shm_size: '256mb'
        volumes:
            - ".:/var/www/html"
            - "facade-storage-framework:/var/www/html/storage/framework"
            - "facade-storage-logs:/var/www/html/storage/logs"
        networks:
            - facade_network
        depends_on:
            - postgres
            - redis

    nginx:
        image: nginx:alpine
        container_name: ${NGINX_CONTAINER_NAME:-apis-hub-facade-nginx}
        ports:

            - "${APP_PORT:-8001}:80"
        volumes:
            - ".:/var/www/html"
            - "./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf"
        networks:
            - facade_network
        depends_on:
            - facade-app

    postgres:
        image: 'postgres:16'
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: "${DB_DATABASE:-apis_hub_facade}"
            POSTGRES_USER: "${DB_USERNAME:-laravel}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - 'facade-postgres:/var/lib/postgresql/data'
        networks:
            - facade_network
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${DB_DATABASE:-apis_hub_facade}", "-U", "${DB_USERNAME:-laravel}"]
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - 'facade-redis:/data'
        networks:
            - facade_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

networks:
    facade_network:
        driver: bridge
        name: ${FACADE_NETWORK_NAME:-apis-hub-facade-network}

volumes:
    facade-postgres:
        driver: local
    facade-redis:
        driver: local
    facade-storage-framework:
        driver: local
    facade-storage-logs:
        driver: local


